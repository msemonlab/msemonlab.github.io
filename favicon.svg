<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <defs>
    <radialGradient id="lab-radiance" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#C19F4B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B1528" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0B1528" />
  <rect width="100" height="100" fill="url(#lab-radiance)" />
  
  <!-- Lab Hexagon Structure -->
  <polygon points="50 18, 78 34, 78 66, 50 82, 22 66, 22 34" fill="none" stroke="#C19F4B" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Analytical Tree / System Branching -->
  <path d="M 50 82 L 50 50 M 50 50 L 32 32 M 50 50 L 68 32 M 50 66 L 35 66 M 50 66 L 65 66" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Value Nodes -->
  <circle cx="32" cy="32" r="3" fill="#C19F4B"/>
  <circle cx="68" cy="32" r="3" fill="#C19F4B"/>
  <circle cx="35" cy="66" r="3" fill="#C19F4B"/>
  <circle cx="65" cy="66" r="3" fill="#C19F4B"/>
  <circle cx="50" cy="50" r="4" fill="#FDE047"/>
</svg>
